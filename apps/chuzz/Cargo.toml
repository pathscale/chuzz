[package]
# The package is the browser as a library, so an embedder can depend on it.
# The binaries keep their own names: `chuzz-gui` is the window, `chuzz-headless`
# the inspection host, and both are referenced by build-app.sh, the release
# workflow and the Homebrew cask.
name = "chuzz"
description = "A pure Rust web browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[[bin]]
name = "chuzz-gui"
path = "src/gui_main.rs"
# The native window belongs to izumo. A headless build omits the shell.
required-features = ["gui"]

# The same browser with no window, serving one page over the inspection socket
# for `ps-qa` to drive. See `src/serve.rs` for why this is a mode of the binary's
# package rather than a second host in another repo.
#
# `capture` for the CPU rasteriser, because a visual assertion is a screenshot
# request over the socket; `javascript` because a page whose scripts never ran
# is not the page anyone is asking about. Both are defaults, so this is a
# statement of what the binary needs rather than a build to remember to ask.
[[bin]]
name = "chuzz-headless"
path = "src/headless_main.rs"
required-features = ["capture", "javascript"]

[features]
# The renderer choice follows AgencyZero's Blitz performance thesis: Vello on
# wgpu, so macOS gets Metal and Linux/Windows keep Vulkan and D3D12 later.
default = [
  "gui",
  "vello",
  "scrollbars",
  "javascript",
  "wasm",
  "capture",
  "webp",
  "avif",
]
# The window and its izumo surface: `browser`, `frontend` and the `chuzz-gui`
# binary. A headless build turns this off and keeps the engine, the loader, the
# rasteriser and the inspection socket, which is everything ps-qa drives.
gui = [
  "dep:izumo",
  "izumo/runtime",
  # The window paints glyphs, so it wants real faces. On Linux this reaches
  # parley's enumeration and therefore fontconfig, which is why it is here and
  # not in the base dependencies. Rendered QA opts in through the same feature.
  "system-fonts",
]
# Let a WebAssembly guest build a page, through `--wasm` in the window and
# `--capture-wasm` headlessly. On by default because it is a way of opening a
# page rather than a diagnostic: with it off, `--wasm` is not a flag the binary
# has. The wasm interpreter it pulls in is small and never instantiated unless
# a module is named.
wasm = ["dep:blitz-wasm", "dep:wasmi"]
# Most of the web builds its DOM in JavaScript: without this a script-rendered
# page parses to an empty mount point and paints nothing.
javascript = ["dep:blitz-script", "dep:objc2", "dep:objc2-core-media"]
# Opt in for rendered QA as well as GUI builds. A minimal headless embedder
# can still omit font discovery and provide its own faces.
system-fonts = ["blitz-dom/system-fonts", "blitz-script?/system-fonts"]
# The `image` crate is pulled in with default features off, so without these a
# .webp or .avif downloads fine and then cannot be decoded: the element simply
# never paints, which reads as a missing asset rather than a missing codec.
webp = ["image/webp"]
# Render a page headlessly to a PNG, through `--capture` and `--capture-wasm`.
#
# On by default. It was off, on the reasoning that the windowed browser never
# needs the CPU rasteriser, and that reasoning cost more than it saved: a plain
# `cargo build` produced a binary where `--capture` was silently not a flag,
# which reads as the flag being broken rather than absent. Every build script
# that wanted it had to remember to ask, and `build-app.sh` (the one the
# release workflow runs) did not, so the shipped app could not capture at all.
#
# This is a standalone feature set: `--no-default-features --features
# capture` selects the CPU rasteriser and PNG encoder without requiring the
# window's Vello renderer.
#
# The cost is the rasteriser, blitz-paint and the PNG encoder in every build.
# None of it is reachable from the window, so it is size, not behaviour.
#
# `--capture-wasm` is the sibling entry point and rides the same flag, so a
# guest-built page cannot render one way in a tab and another in a capture.
capture = [
  "dep:anyrender",
  "dep:anyrender_vello_cpu",
  "dep:blitz-paint",
  "dep:png",
  "wasm",
]
avif = ["image/avif"]
vello = ["izumo?/runtime"]
# `incremental` was a feature flag upstream; PR #599 made it a runtime setting on
# DocumentConfig, so the forwarding feature no longer has anything to forward to.
scrollbars = ["blitz-dom/scrollbars"]

[dependencies]
# Default features are the engine's own baseline: svg (inline SVG cannot be
# measured or painted without it, so a logo silently collapses),
# accessibility, file-input and custom-widget. Stripping them and re-adding one
# by hand was how the logo broke.
#
# `system-fonts` is NOT here. It went behind `gui` with the rest of the window,
# because it is a system dependency: on Linux it reaches parley's enumeration
# and therefore fontconfig, and a headless build then wants development headers
# for a browser that opens no window and paints no glyph.
# ps-blitz took it out of blitz-dom's own defaults for this reason in
# "build: no font dependency in a headless build"; naming it again here put it
# straight back.
blitz-dom = { workspace = true, default-features = true, features = ["woff"] }
blitz-html = { workspace = true, default-features = true }
# compression: reqwest only sends Accept-Encoding for codecs it was built
# with, so without it every response arrives uncompressed and a page costs
# several times the bytes it should. cache: without it every navigation is
# cold, including a reload of the page you are already on.
blitz-net = { workspace = true, features = ["http2", "cookies", "compression", "cache"] }
blitz-script = { workspace = true, optional = true }
blitz-traits = { workspace = true, default-features = true }
blitz-wasm = { workspace = true, optional = true }
wasmi = { workspace = true, optional = true }
brotli.workspace = true
image = { workspace = true, default-features = false }
anyrender = { workspace = true, optional = true }
anyrender_vello_cpu = { workspace = true, optional = true }
blitz-paint = { workspace = true, optional = true }
png = { workspace = true, optional = true }
flate2.workspace = true
nagoya.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
cursor-icon.workspace = true
cookie_store.workspace = true
psl.workspace = true
blitz-control-protocol = { workspace = true, features = ["engine", "server", "capture"] }
izumo = { workspace = true, optional = true }
nago-wss.workspace = true
worktable.workspace = true
# The headless painter is CPU-only, so page WebGPU must also be able to open
# a device without the GUI renderer. Match ps-blitz's published wgpu range.
wgpu = { version = "^29", default-features = false, features = [
  "std",
  "parking_lot",
  "metal",
  "vulkan",
  "dx12",
  "wgsl",
  "serde",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Owned Objective-C messaging for the system decoder. CoreMedia supplies the
# platform ABI and Objective-C encodings for times and sample-buffer pointers.
objc2 = { version = "^0.6", optional = true }
objc2-core-media = { version = "^0.3", optional = true, default-features = false, features = [
  "std",
  "objc2",
  "CMBase",
  "CMFormatDescription",
  "CMSampleBuffer",
  "CMTime",
  "CMTimeRange",
] }

[dev-dependencies]
# Assembles `fixtures/panel.wat` into a module in-process, so the capture test
# owns its guest instead of borrowing blitz-wasm's demo, and so it needs no
# wasm32 target and no nested cargo build. See the header of that file.
wat = "1"

[build-dependencies]
brotli.workspace = true


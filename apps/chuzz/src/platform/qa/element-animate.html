<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ELEMENT-ANIMATE</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible ELEMENT-ANIMATE fixture sample</p>
<p id="result" role="status">READY: ELEMENT-ANIMATE</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const element = document.createElement('div'); element.style.cssText = 'width:40px;height:20px;opacity:0.2'; document.body.appendChild(element);
const animation = element.animate([{opacity:'0.2'},{opacity:'0.8'}], {duration:100,fill:'forwards'});
await animation.ready; animation.currentTime = 50;
assert(Math.abs(Number(getComputedStyle(element).opacity) - 0.5) < 0.02, 'visible interpolation');
const finished = animation.finished; animation.finish(); await finished;
assert(animation.playState === 'finished' && Math.abs(Number(getComputedStyle(element).opacity) - 0.8) < 0.02, 'finish state and final style');
element.style.opacity = '0.3'; const canceled = element.animate([{opacity:'0.3'},{opacity:'0.9'}], {duration:100,fill:'forwards'});
const rejected = canceled.finished.then(() => false, error => error.name === 'AbortError'); canceled.cancel();
assert(await rejected && element.style.opacity === '0.3', 'cancel rejects finished and restores style');
const empty = document.documentElement.animate([], 0);
assert(empty && typeof empty.cancel === 'function' && typeof empty.finish === 'function', 'empty keyframes make a no-op animation');
const indexed = element.animate({opacity:['0.1','0.7']}, {duration:100,fill:'forwards'});
await indexed.ready; indexed.currentTime = 50;
assert(Math.abs(Number(getComputedStyle(element).opacity) - 0.4) < 0.02, 'property-indexed keyframes interpolate');
indexed.cancel();
    result.textContent = "READY: ELEMENT-ANIMATE PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

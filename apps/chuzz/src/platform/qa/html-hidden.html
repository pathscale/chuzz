<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HTML-HIDDEN</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible HTML-HIDDEN fixture sample</p>
<p id="result" role="status">READY: HTML-HIDDEN</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const descriptor = Object.getOwnPropertyDescriptor(HTMLElement.prototype,'hidden');
assert(descriptor && typeof descriptor.get === 'function' && 'hidden' in HTMLElement.prototype, 'prototype shape');
const element = document.createElement('div'); element.style.cssText = 'width:20px;height:20px'; document.body.appendChild(element); element.hidden = true;
assert(element.hasAttribute('hidden') && element.hidden && getComputedStyle(element).display === 'none', 'instance reflection and rendering');
    result.textContent = "READY: HTML-HIDDEN PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>IS-CONTENT-EDITABLE</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible IS-CONTENT-EDITABLE fixture sample</p>
<p id="result" role="status">READY: IS-CONTENT-EDITABLE</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const parent = document.createElement('div'); parent.contentEditable = 'true'; const child = document.createElement('span'); parent.appendChild(child); document.body.appendChild(parent);
assert(parent.isContentEditable && child.isContentEditable, 'ancestor editability');
child.contentEditable = 'false'; assert(!child.isContentEditable, 'false barrier');
child.setAttribute('contenteditable','invalid'); assert(child.isContentEditable, 'invalid value inherits from ancestor');
    result.textContent = "READY: IS-CONTENT-EDITABLE PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

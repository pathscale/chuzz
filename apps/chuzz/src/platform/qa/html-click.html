<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HTML-CLICK</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible HTML-CLICK fixture sample</p>
<p id="result" role="status">READY: HTML-CLICK</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const descriptor = Object.getOwnPropertyDescriptor(HTMLElement.prototype,'click');
assert(descriptor && typeof descriptor.value === 'function' && 'click' in HTMLElement.prototype, 'prototype shape');
const button = document.createElement('button'); let clicks = 0; button.addEventListener('click', () => clicks++); button.click();
assert(clicks === 1, 'instance click behavior');
    result.textContent = "READY: HTML-CLICK PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

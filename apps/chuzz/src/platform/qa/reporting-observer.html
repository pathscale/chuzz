<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>REPORTING-OBSERVER</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible REPORTING-OBSERVER fixture sample</p>
<p id="result" role="status">READY: REPORTING-OBSERVER</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    let callbacks = 0; const observer = new ReportingObserver(() => callbacks++);
assert(Array.isArray(ReportingObserver.supportedEntryTypes), 'supported types list');
observer.observe({type:ReportingObserver.supportedEntryTypes[0]});
assert(observer.takeRecords().length === 0, 'no invented report'); observer.disconnect();
await Promise.resolve(); assert(callbacks === 0, 'no producer integration');
let invalid = false; try { new ReportingObserver(null); } catch (error) { invalid = error instanceof TypeError; }
assert(invalid, 'constructor validation');
    result.textContent = "READY: REPORTING-OBSERVER PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>CHECK-VISIBILITY</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible CHECK-VISIBILITY fixture sample</p>
<p id="result" role="status">READY: CHECK-VISIBILITY</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const visible = document.createElement('div'); visible.style.cssText = 'width:20px;height:20px'; document.body.appendChild(visible);
assert(visible.checkVisibility(), 'visible box'); visible.style.opacity = '0';
assert(visible.checkVisibility() && !visible.checkVisibility({checkOpacity:true}), 'opacity option');
visible.style.cssText = 'display:none;width:20px;height:20px'; assert(!visible.checkVisibility(), 'display none');
visible.style.cssText = 'visibility:hidden;width:20px;height:20px'; assert(!visible.checkVisibility(), 'visibility hidden');
const parent = document.createElement('div'); parent.style.display = 'contents'; const child = document.createElement('span'); child.style.cssText = 'display:block;width:20px;height:20px'; parent.appendChild(child); document.body.appendChild(parent);
assert(parent.checkVisibility(), 'display contents with visible child');
const detached = document.createElement('div'); detached.style.cssText = 'width:20px;height:20px'; assert(!detached.checkVisibility(), 'detached element');
    result.textContent = "READY: CHECK-VISIBILITY PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

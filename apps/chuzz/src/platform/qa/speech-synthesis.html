<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SPEECH-SYNTHESIS</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible SPEECH-SYNTHESIS fixture sample</p>
<p id="result" role="status">READY: SPEECH-SYNTHESIS</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    assert(speechSynthesis.getVoices().length === 0 && !speechSynthesis.speaking && !speechSynthesis.pending, 'empty truthful voice and queue state');
const canceled = new SpeechSynthesisUtterance('cancel'); let canceledError = false;
canceled.addEventListener('error', () => canceledError = true); speechSynthesis.speak(canceled); speechSynthesis.cancel();
await new Promise(resolve => setTimeout(resolve, 5)); assert(!canceledError, 'cancel suppresses pending failure');
const utterance = new SpeechSynthesisUtterance('unsupported');
const spoken = new Promise((resolve, reject) => { utterance.addEventListener('error', event => resolve(event.error)); setTimeout(() => reject(new Error('speech error timeout')), 1000); });
speechSynthesis.speak(utterance); assert(await spoken === 'synthesis-unavailable', 'asynchronous unsupported error');
assert(!speechSynthesis.speaking, 'no false successful speech');
    result.textContent = "READY: SPEECH-SYNTHESIS PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

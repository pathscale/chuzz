<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>INNER-TEXT</title>
<style>
@font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
body { margin: 20px; color: #102030; background: #fff; font: 16px Fixture, sans-serif; }
button { font: inherit; padding: 8px 20px; }
#samples { display: block; min-width: 280px; min-height: 24px; margin: 12px 0; border: 1px solid #304050; }
#result { display: block; min-height: 24px; font-size: 18px; }
</style></head><body>
<button id="run" type="button">Run checks</button>
<p id="samples">Visible INNER-TEXT fixture sample</p>
<p id="result" role="status">READY: INNER-TEXT</p>
<script>
document.getElementById("run").addEventListener("click", async function () {
  this.disabled = true;
  const result = document.getElementById("result");
  try {
    await document.fonts.ready;
    const assert = (value, message) => { if (!value) throw new Error(message); };
    const element = document.createElement('div'); element.innerHTML = '<div>a   b</div><div style="display:none">hidden text</div><br><span>c</span>'; document.body.appendChild(element);
const rendered = element.innerText.replace(/\s+/g,' ').trim(); assert(rendered === 'a b c' && !rendered.includes('hidden'), 'rendered text and hidden descendants');
const detached = document.createElement('div'); detached.innerHTML = '<b>detached</b>'; assert(detached.innerText.includes('detached'), 'detached fallback');
element.innerText = 'first\nsecond'; assert(element.innerText.includes('first') && element.innerText.includes('second') && element.innerHTML.toLowerCase().includes('<br'), 'line break setter');
    result.textContent = "READY: INNER-TEXT PASS";
  } catch (error) {
    result.textContent = "FAIL: " + String(error && error.message || error);
  }
});
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Original title</title>
  <style>
    @font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
    body { margin: 24px; background: #151923; color: white; font-family: Fixture; }
  </style>
</head>
<body>
  <p id="result" role="status">Title setter waiting</p>
  <script>
    "use strict";
    // Strict code assigning document.title: replace the existing <title>, create one in <head> of a
    // document that has none.
    function run() {
      document.title = "Replaced title";
      var titles = document.getElementsByTagName("title");
      if (document.title !== "Replaced title" || titles.length !== 1) {
        return "existing " + JSON.stringify(document.title) + " count " + titles.length;
      }
      var created = document.implementation.createHTMLDocument();
      created.title = "Created title";
      var head = created.head.getElementsByTagName("title");
      if (head.length !== 1 || head[0].textContent !== "Created title") return "created count " + head.length;
      return null;
    }
    var failure;
    try { failure = run(); } catch (error) { failure = "threw " + error.message; }
    document.getElementById("result").textContent = failure ? "FAIL: TITLESET " + failure : "READY: TITLESET PASS";
  </script>
</body>
</html>

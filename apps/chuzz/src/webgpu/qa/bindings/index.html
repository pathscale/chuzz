<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebGPU bindings QA</title>
  <style>
    body { margin: 20px; background: #182335; color: white; font-family: Fixture; }
    @font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
    canvas { display: block; width: 256px; height: 256px; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>WebGPU bindings QA</h1>
  <button id="run" type="button">Run binding checks</button>
  <p id="result" role="status">Ready</p>
  <canvas id="stage" width="64" height="64" aria-label="Triangle with empty bindings"></canvas>
  <script type="module">
    const result = document.getElementById("result");
    const stage = document.getElementById("stage");
    function assert(condition, message) { if (!condition) { throw new Error(message); } }
    document.getElementById("run").onclick = async () => {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        assert(adapter, "no WebGPU adapter");
        const device = await adapter.requestDevice();
        const errors = [];
        device.addEventListener("uncapturederror", event => errors.push(event.error.message));
        const format = navigator.gpu.getPreferredCanvasFormat();
        const context = stage.getContext("webgpu");
        context.configure({ device, format, alphaMode: "opaque" });
        const module = device.createShaderModule({ code: `
          @vertex fn vs(@location(0) p: vec2f) -> @builtin(position) vec4f { return vec4f(p, 0.0, 1.0); }
          @fragment fn fs() -> @location(0) vec4f { return vec4f(1.0, 0.0, 0.0, 1.0); }
        ` });
        const pipeline = device.createRenderPipeline({
          layout: "auto",
          vertex: { module, entryPoint: "vs", buffers: [{ arrayStride: 8, attributes: [{ shaderLocation: 0, offset: 0, format: "float32x2" }] }] },
          fragment: { module, entryPoint: "fs", targets: [{ format }] },
          primitive: { topology: "triangle-list" },
        });
        const triangle = device.createBuffer({ size: 24, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
        device.queue.writeBuffer(triangle, 0, new Float32Array([-0.6, -0.6, 0.6, -0.6, 0, 0.6]));
        // Zero-size bindings are valid WebGPU: an empty geometry attribute binds a
        // buffer with size 0, and an empty index buffer feeds a zero-count draw.
        const empty = device.createBuffer({ size: 16, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.INDEX });
        device.pushErrorScope("validation");
        const encoder = device.createCommandEncoder();
        const pass = encoder.beginRenderPass({ colorAttachments: [{
          view: context.getCurrentTexture().createView(), loadOp: "clear", storeOp: "store",
          clearValue: { r: 0, g: 0, b: 1, a: 1 },
        }] });
        pass.setPipeline(pipeline);
        pass.setVertexBuffer(0, empty, 16, 0);
        pass.setIndexBuffer(empty, "uint16", 0, 0);
        pass.drawIndexed(0);
        pass.setVertexBuffer(0, triangle);
        pass.draw(3);
        pass.end();
        device.queue.submit([encoder.finish()]);
        const scoped = await device.popErrorScope();
        assert(!scoped, "empty bindings raised: " + (scoped && scoped.message));
        await device.queue.onSubmittedWorkDone();
        await new Promise(resolve => setTimeout(resolve, 50));
        const probe = document.createElement("canvas");
        probe.width = 64; probe.height = 64;
        const c = probe.getContext("2d");
        let pixel = [0, 0, 0, 0];
        for (let attempt = 0; attempt < 40; attempt++) {
          c.drawImage(stage, 0, 0);
          pixel = Array.from(c.getImageData(32, 32, 1, 1).data);
          if (pixel[0] > 200 && pixel[2] < 50) break;
          await new Promise(resolve => setTimeout(resolve, 25));
        }
        assert(pixel[0] > 200 && pixel[1] < 50 && pixel[2] < 50, "triangle pixel " + pixel.join(","));
        assert(errors.length === 0, "uncaptured: " + errors.join("; "));
        result.textContent = "READY: WebGPU bindings PASS";
      } catch (error) {
        result.textContent = "FAIL: " + error.message;
      }
    };
  </script>
</body>
</html>

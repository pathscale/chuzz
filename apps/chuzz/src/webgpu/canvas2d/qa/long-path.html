<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canvas long path QA</title>
  <style>
    @font-face { font-family: Fixture; src: url("./fonts/FiraSans-Regular.woff2") format("woff2"); }
    body { margin: 24px; background: #151923; color: white; font-family: Fixture; }
  </style>
</head>
<body>
  <canvas id="long" width="200" height="120" aria-label="Long path canvas"></canvas>
  <p id="result" role="status">Long path waiting</p>
  <script>
    // A renderer that strokes in a loop without beginPath grows one path across frames. Chrome keeps drawing; so
    // must chuzz, well past the old 65,536-element cap.
    var context = document.getElementById("long").getContext("2d");
    context.strokeStyle = "#ffffff";
    var frames = 0;
    function frame() {
      for (var i = 0; i < 2000; i++) {
        var x = (i * 7 + frames) % 200;
        context.moveTo(x, 10);
        context.lineTo(x, 110);
      }
      context.stroke();
      frames += 1;
      if (frames < 50) { requestAnimationFrame(frame); return; }
      var pixel = context.getImageData(100, 60, 1, 1).data;
      document.getElementById("result").textContent = pixel[3] > 0
        ? "READY: LONGPATH PASS" : "FAIL: LONGPATH nothing stroked";
    }
    try { requestAnimationFrame(frame); }
    catch (error) { document.getElementById("result").textContent = "FAIL: LONGPATH " + error.message; }
  </script>
</body>
</html>

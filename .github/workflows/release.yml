name: Release

# Publishes when the version changes, and only then.
#
# Mirrors AgencyZero's release.yml, which publishes to the same pull zone. The
# version lives in one place, `[workspace.package] version` in the root
# Cargo.toml; `apps/chuzz/build-app.sh` stamps it into the bundle's Info.plist,
# and the verify step checks the two agree, so latest.json can never advertise a
# version the app does not report.
#
# "Changed" is decided against what is actually published, not against git
# history. Comparing to the live latest.json makes this idempotent: a release
# that failed halfway is retried by the next push, a re-run is harmless, and
# squashes and force-pushes cannot confuse it.
#
# Publishing overwrites a fixed, versionless CDN path, so latest.json is the
# only record of the current version. That is why the purges below are hard
# failures: a stale edge copy is indistinguishable, to a client, from a release
# that never happened.
#
# The publish choreography follows AgencyZero's, which follows the 24x.ai site
# pipeline: DELETE the storage object before uploading its replacement, and
# purge the whole pull zone rather than one URL. Overwriting in place is how
# AgencyZero's 0.1.1 release got poisoned, when an edge pulled mid-overwrite and
# cached a truncated gzip for the length of its max-age. The per-URL purge
# endpoint reported success without evicting it, three times. A zone-wide purge
# does evict, and the site fronted by this same zone purges it on every deploy
# of its own, so the collateral is nil.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version has not changed"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CDN_DIR: chuzz
  CDN_BASE: https://24x.ai/chuzz
  BUNDLE_DIR: target/release/bundle/macos

jobs:
  # Cheap gate, so a macOS runner is only spent on pushes that actually ship.
  # This half has no macOS dependency, so it follows the usual runner rule.
  check:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare the committed version against the published one
        id: decide
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          LIVE=$(curl -fsS --max-time 30 "$CDN_BASE/latest.json" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Forced: publishing $VERSION over live '${LIVE:-none}'."
          elif [ -z "$LIVE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Nothing published yet, so $VERSION is the first release."
          elif [ "$LIVE" != "$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Committed $VERSION differs from live $LIVE, publishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Live is already $LIVE; nothing to do. Bump [workspace.package] version to release."
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # The only job here that cannot use ubicloud-standard-*: Ubicloud offers
    # Linux runners only, and a macOS bundle needs the macOS SDK and Apple's
    # signing tools. Same Namespace profile AgencyZero uses, and it is arm64,
    # so the build is native rather than cross.
    runs-on: namespace-profile-agency-tahoe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The engine is not checked out here any more. It was, and the revision
      # lived in a BLITZ_REF env var on this step while the workspace took the
      # same crates by path from a sibling checkout — two sources of truth that
      # nothing reconciled. The pin sat 44 commits behind, and the job broke the
      # day a new engine package was added, because a path dependency resolves
      # against whatever is on disk and no local build could notice.
      #
      # `Cargo.toml` now pins ps-blitz, tauri-runtime-blitz and endpoint-libs by
      # revision, so cargo fetches them and `Cargo.lock` records them. An
      # ordinary `cargo build` on any machine resolves exactly what this job
      # does. See scripts/local-engine.sh for building against a working
      # checkout, which is opt-in so the default keeps testing these pins.

      # For `bunx @tauri-apps/cli signer sign` below. The runner has no bun
      # preinstalled, and without this the release builds, bundles and packs
      # correctly and then dies at the signing step with `bunx: command not
      # found`, having spent the whole macOS build.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun install` before anything touches cargo, because the Rust build
      # script shells out to `bun run build`, whose `prebuild` step runs
      # `solid-layouts-library` from `node_modules/.bin`. On a fresh checkout
      # that binary does not exist and the build script panics with
      #
      #   solid-layouts-library: command not found
      #   error: script "prebuild" exited with code 127
      #
      # which reads as a missing tool rather than a missing install. It never
      # showed up locally because every developer machine already has
      # node_modules from an earlier build.
      #
      # `--frozen-lockfile` so a release cannot quietly resolve a different tree
      # from the committed bun.lock.
      - name: Install frontend dependencies
        working-directory: apps/chuzz/frontend
        run: bun install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: chuzz-macos-release
          cache-targets: true

      # Ad-hoc signed by build-app.sh via `codesign --sign -`, which needs no
      # certificate. Notarization needs a current Apple Developer Program
      # membership; the verify step below asserts the bundle is still ad-hoc so
      # that acquiring one cannot silently leave the cask stripping a Gatekeeper
      # check users should be getting.
      - name: Build the bundle
        run: apps/chuzz/build-app.sh release

      - name: Verify the bundle
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APP="$BUNDLE_DIR/Chuzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|Sealed Resources"

          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::bundle reports $BUILT but this release is $VERSION"
            exit 1
          fi
          echo "bundle version $BUILT matches"

          if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "ad-hoc as expected"
          else
            echo "::error::bundle is no longer ad-hoc; update the verification and the cask"
            exit 1
          fi

      # Tauri produces this tarball as a side effect of its bundler. Chuzz has no
      # Tauri, so it is packed here. COPYFILE_DISABLE stops bsdtar writing an
      # AppleDouble `._` sidecar beside every file carrying an extended
      # attribute, and the round trip proves the code signature survived being
      # archived: tar preserving modes is not the same as tar preserving a
      # signature, and getting that wrong only shows up on someone else's Mac.
      - name: Pack the tarball
        run: |
          COPYFILE_DISABLE=1 tar -czf "$BUNDLE_DIR/Chuzz.app.tar.gz" \
            -C "$BUNDLE_DIR" Chuzz.app
          gunzip -t "$BUNDLE_DIR/Chuzz.app.tar.gz" || {
            echo "::error::the built tarball is not a valid gzip"; exit 1;
          }
          mkdir -p roundtrip && tar -xzf "$BUNDLE_DIR/Chuzz.app.tar.gz" -C roundtrip
          codesign --verify --deep --strict roundtrip/Chuzz.app
          rm -rf roundtrip
          echo "packed and the signature survived the round trip"

      # minisign, unrelated to Apple signing: it signs the payload rather than
      # the bundle, so a client can check the bytes it fetched came from this
      # pipeline. Produced by the same rsign2 implementation and key format
      # Tauri uses, so the signature is verifiable with the public key already
      # published beside AgencyZero's.
      - name: Sign the tarball
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to sign the release"
            exit 1
          fi
          bunx --yes @tauri-apps/cli@^2.11 signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "" \
            "$BUNDLE_DIR/Chuzz.app.tar.gz"
          test -f "$BUNDLE_DIR/Chuzz.app.tar.gz.sig" || {
            echo "::error::signer produced no .sig"; exit 1;
          }
          echo "signed"

      - name: Build latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TARBALL="$BUNDLE_DIR/Chuzz.app.tar.gz"
          test -f "$TARBALL.sig" || { echo "::error::missing $TARBALL.sig"; exit 1; }
          python3 - "$VERSION" "$TARBALL.sig" "$CDN_BASE" <<'PY'
          import json, sys, datetime
          version, sig_path, base = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(sig_path) as f:
              signature = f.read().strip()
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": signature,
                      # The query string is a cache-buster, and it works because
                      # this pull zone keys its cache on the full URL including
                      # the query, so each release advertises a URL no edge has
                      # ever held. Brew fetches the bare URL and relies on the
                      # purge.
                      "url": f"{base}/Chuzz.app.tar.gz?v={version}",
                  }
              },
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat latest.json

      # Ordering matters and is the whole reason these are separate steps. The
      # tarball goes live and is confirmed live *before* latest.json advertises
      # it. Reversed, a client reads the new version and fetches an edge-cached
      # older tarball.
      - name: Upload the tarball
        env:
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
        run: |
          upload() {
            file="$1"; dest="$2"; attempt=1
            curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
              "https://storage.bunnycdn.com/$STORAGE_NAME/$dest" || true
            while [ "$attempt" -le 4 ]; do
              code=$(curl -sS -X PUT -H "AccessKey: $STORAGE_API_KEY" \
                -T "$file" -o /dev/null -w '%{http_code}' \
                "https://storage.bunnycdn.com/$STORAGE_NAME/$dest")
              case "$code" in
                200|201) echo "uploaded $dest"; return 0 ;;
              esac
              echo "::warning::attempt $attempt for $dest: HTTP $code"
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
            done
            echo "::error::upload failed for $dest"
            return 1
          }
          upload "$BUNDLE_DIR/Chuzz.app.tar.gz" "$CDN_DIR/Chuzz.app.tar.gz"
          upload "$BUNDLE_DIR/Chuzz.app.tar.gz.sig" "$CDN_DIR/Chuzz.app.tar.gz.sig"

      - name: Purge the pull zone
        env:
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          if [ -z "$ZONE_API_KEY" ] || [ -z "$ZONE_ID" ]; then
            echo "::error::BUNNYCDN_ZONE_API_KEY and BUNNYCDN_ZONE_ID are required: a versionless URL that is not purged serves the previous release forever."
            exit 1
          fi
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"
          echo "purged pull zone $ZONE_ID"

      - name: Confirm the live tarball is the one just built
        env:
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          LOCAL=$(shasum -a 256 "$BUNDLE_DIR/Chuzz.app.tar.gz" | cut -d' ' -f1)
          for attempt in 1 2 3 4 5 6; do
            curl -sS -L -o edge.tar.gz "$CDN_BASE/Chuzz.app.tar.gz" || true
            REMOTE=$(shasum -a 256 edge.tar.gz | cut -d' ' -f1)
            # The sha proves identity; gunzip proves the edge did not cache a
            # partial response. Both, so the failure message names the culprit.
            if [ "$LOCAL" = "$REMOTE" ] && gunzip -t edge.tar.gz; then
              echo "edge matches build ($LOCAL) and the gzip is intact"
              exit 0
            fi
            echo "attempt $attempt: edge has $REMOTE, want $LOCAL"
            if [ "$attempt" = 3 ]; then
              echo "::warning::edge still stale after purge; purging the zone again"
              curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
                "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache" || true
            fi
            sleep 10
          done
          echo "::error::edge never served the new tarball; not publishing latest.json"
          exit 1

      - name: Publish latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json" || true
          curl -sS --fail-with-body -X PUT -H "AccessKey: $STORAGE_API_KEY" \
            -T latest.json "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json"
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"

          # latest.json is the version record, so a stale edge copy here means
          # nobody sees the release. It is also what the next run compares
          # against, so a stale copy would republish this version forever.
          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -sS -L "$CDN_BASE/latest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            if [ "$LIVE" = "$VERSION" ]; then
              echo "edge serves version $LIVE"
              exit 0
            fi
            echo "attempt $attempt: edge serves '$LIVE', want '$VERSION'"
            if [ "$attempt" = 3 ]; then
              echo "::warning::edge still stale after purge; purging the zone again"
              curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
                "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache" || true
            fi
            sleep 10
          done
          echo "::error::edge never served the new latest.json"
          exit 1

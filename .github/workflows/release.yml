name: Release

# Publishes Chuzz.app to the CDN and updates the Homebrew cask, when the
# version changes and only then.
#
# The version lives in one place: `[workspace.package] version` in the root
# Cargo.toml. `apps/chuzz/build-app.sh` stamps it into the bundle's Info.plist,
# and the verify step below checks the two agree, so the manifest can never
# advertise a version the app does not report.
#
# Modelled on AgencyZero's release.yml, which publishes the same way to the same
# pull zone, with one deliberate difference: **the URL carries the version.**
# AgencyZero can overwrite a fixed path because it carries a self-updater and
# pulls itself forward; Chuzz has no updater, so a versionless URL with
# `sha256 :no_check` would leave every installed copy pinned to whatever it
# first fetched, with `brew upgrade` unable to see a new release. A versioned
# URL means a real `sha256` in the cask, a working `brew upgrade`, and one file
# per release in storage.
#
# That also removes the failure mode that dominates AgencyZero's pipeline. Each
# release writes a path no edge has ever held, so a stale or half-cached object
# cannot be served in place of the new one. The purge below is belt and braces
# rather than the thing holding the release together.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if the version has not changed"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CDN_DIR: chuzz
  CDN_BASE: https://24x.ai/chuzz
  BUNDLE_DIR: target/release/bundle/macos

jobs:
  # Cheap gate, so a macOS runner is only spent on pushes that actually ship.
  # No macOS dependency here, so it follows the usual runner rule.
  check:
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decided against what is actually published rather than against git
      # history, which makes this idempotent: a release that failed halfway is
      # retried by the next push, a re-run is harmless, and squashes and
      # force-pushes cannot confuse it.
      - name: Compare the committed version against the published one
        id: decide
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          LIVE=$(curl -fsS --max-time 30 "$CDN_BASE/latest.json" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Forced: publishing $VERSION over live '${LIVE:-none}'."
          elif [ -z "$LIVE" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Nothing published yet, so $VERSION is the first release."
          elif [ "$LIVE" != "$VERSION" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Committed $VERSION differs from live $LIVE, publishing."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Live is already $LIVE; nothing to do. Bump [workspace.package] version to release."
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    # Ubicloud offers Linux runners only, and a macOS bundle needs the macOS SDK
    # and Apple's signing tools. Same profile AgencyZero uses, and it is arm64,
    # so the build is native rather than cross.
    runs-on: namespace-profile-agency-tahoe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Chuzz path-depends on sibling checkouts, so the engine has to be beside
      # it on the runner exactly as it is on a developer's machine. The revision
      # is pinned rather than floating: a release must be reproducible, and
      # tracking a branch would make the same Chuzz version mean different
      # engines on different days.
      - name: Check out the engine and endpoint-libs
        env:
          BLITZ_REF: master
        run: |
          cd ..
          git clone --filter=blob:none https://github.com/pathscale/ps-blitz.git blitz-rust
          git -C blitz-rust checkout "$BLITZ_REF"
          git -C blitz-rust log -1 --format='engine at %H %s'
          git clone --depth 1 https://github.com/pathscale/endpoint-libs.git endpoint-libs

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: chuzz-macos-release
          cache-targets: true

      - name: Build the bundle
        run: apps/chuzz/build-app.sh release

      # Two failures worth catching. A bundle whose signature does not verify
      # reports itself to the user as "damaged and can't be opened", which names
      # nothing about signing. And a bundle whose version disagrees with
      # Cargo.toml would be advertised under a version it does not report, so
      # every client would see an upgrade that changes nothing.
      - name: Verify the bundle
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APP="$BUNDLE_DIR/Chuzz.app"
          codesign --verify --deep --strict --verbose=2 "$APP"

          BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::bundle reports $BUILT but this release is $VERSION"
            exit 1
          fi
          echo "bundle version $BUILT matches"

          # Assert the bundle really is ad-hoc. If a Developer ID certificate is
          # ever wired in, this fires, and it is the reminder to drop the cask's
          # quarantine postflight and check `spctl -a` here instead.
          if codesign -dv --verbose=4 "$APP" 2>&1 | grep -q "TeamIdentifier=not set"; then
            echo "ad-hoc as expected"
          else
            echo "::error::bundle is no longer ad-hoc; update the verification and the cask"
            exit 1
          fi

      - name: Pack the tarball
        id: pack
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # COPYFILE_DISABLE stops bsdtar writing an AppleDouble `._` sidecar
          # beside every file that carries an extended attribute. Those confuse
          # nothing on macOS but bloat the archive and leak into any Linux
          # extraction of it.
          COPYFILE_DISABLE=1 tar -czf "Chuzz-$VERSION.app.tar.gz" \
            -C "$BUNDLE_DIR" Chuzz.app
          gunzip -t "Chuzz-$VERSION.app.tar.gz" || {
            echo "::error::the built tarball is not a valid gzip"; exit 1;
          }

          # Unpack it somewhere else and check the signature survived the round
          # trip: tar preserving modes is not the same as tar preserving a code
          # signature, and the symptom of getting that wrong only appears on
          # someone else's Mac.
          mkdir -p roundtrip && tar -xzf "Chuzz-$VERSION.app.tar.gz" -C roundtrip
          codesign --verify --deep --strict roundtrip/Chuzz.app
          rm -rf roundtrip

          SHA=$(shasum -a 256 "Chuzz-$VERSION.app.tar.gz" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "packed Chuzz-$VERSION.app.tar.gz sha256 $SHA"

      - name: Build latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          # No signature field and no updater: this manifest exists so the check
          # job above can ask what is live without consulting git, and so a
          # human can answer the same question with curl.
          python3 - "$VERSION" "$SHA" "$CDN_BASE" <<'PY'
          import json, sys, datetime
          version, sha, base = sys.argv[1], sys.argv[2], sys.argv[3]
          manifest = {
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "sha256": sha,
                      "url": f"{base}/Chuzz-{version}.app.tar.gz",
                  }
              },
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          cat latest.json

      # The tarball goes live and is confirmed live before latest.json
      # advertises it, and before the cask points at it. Reversed, a client
      # could read the new version and fetch a URL that is not there yet.
      #
      # The DELETE before the PUT is inherited from AgencyZero's pipeline, where
      # overwriting in place once let an edge cache a partial response. It
      # should be impossible here, since a versioned path is written exactly
      # once, but a forced republish of the same version writes it twice.
      - name: Upload the tarball
        env:
          VERSION: ${{ needs.check.outputs.version }}
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
        run: |
          if [ -z "$STORAGE_API_KEY" ] || [ -z "$STORAGE_NAME" ]; then
            echo "::error::BUNNYCDN_STORAGE_API_KEY and BUNNYCDN_STORAGE_NAME are required"
            exit 1
          fi
          upload() {
            file="$1"; dest="$2"; attempt=1
            curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
              "https://storage.bunnycdn.com/$STORAGE_NAME/$dest" || true
            while [ "$attempt" -le 4 ]; do
              code=$(curl -sS -X PUT -H "AccessKey: $STORAGE_API_KEY" \
                -T "$file" -o /dev/null -w '%{http_code}' \
                "https://storage.bunnycdn.com/$STORAGE_NAME/$dest")
              case "$code" in
                200|201) echo "uploaded $dest"; return 0 ;;
              esac
              echo "::warning::attempt $attempt for $dest: HTTP $code"
              attempt=$((attempt + 1))
              sleep $((attempt * 3))
            done
            echo "::error::upload failed for $dest"
            return 1
          }
          upload "Chuzz-$VERSION.app.tar.gz" "$CDN_DIR/Chuzz-$VERSION.app.tar.gz"

      # Zone-wide, never per-URL: the per-URL endpoint has been observed
      # reporting success without evicting anything, and the site sharing this
      # zone purges the whole zone on every deploy of its own.
      - name: Purge the pull zone
        env:
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          if [ -z "$ZONE_API_KEY" ] || [ -z "$ZONE_ID" ]; then
            echo "::error::BUNNYCDN_ZONE_API_KEY and BUNNYCDN_ZONE_ID are required"
            exit 1
          fi
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"
          echo "purged pull zone $ZONE_ID"

      - name: Confirm the edge serves the tarball we built
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          # The cask pins this exact sha256, so an edge serving anything else
          # gives every installer a checksum failure rather than a bad app.
          # Catch it here instead.
          for attempt in 1 2 3 4 5 6; do
            curl -sS -L -o edge.tar.gz "$CDN_BASE/Chuzz-$VERSION.app.tar.gz" || true
            REMOTE=$(shasum -a 256 edge.tar.gz | cut -d' ' -f1)
            if [ "$SHA" = "$REMOTE" ] && gunzip -t edge.tar.gz; then
              echo "edge matches build ($SHA) and the gzip is intact"
              exit 0
            fi
            echo "attempt $attempt: edge has $REMOTE, want $SHA"
            sleep 10
          done
          echo "::error::edge never served the new tarball; not publishing"
          exit 1

      - name: Publish latest.json
        env:
          VERSION: ${{ needs.check.outputs.version }}
          STORAGE_API_KEY: ${{ secrets.BUNNYCDN_STORAGE_API_KEY }}
          STORAGE_NAME: ${{ secrets.BUNNYCDN_STORAGE_NAME }}
          ZONE_API_KEY: ${{ secrets.BUNNYCDN_ZONE_API_KEY }}
          ZONE_ID: ${{ secrets.BUNNYCDN_ZONE_ID }}
        run: |
          curl -sS -X DELETE -H "AccessKey: $STORAGE_API_KEY" \
            "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json" || true
          curl -sS --fail-with-body -X PUT -H "AccessKey: $STORAGE_API_KEY" \
            -T latest.json "https://storage.bunnycdn.com/$STORAGE_NAME/$CDN_DIR/latest.json"
          curl -sS --fail-with-body -X POST -H "AccessKey: $ZONE_API_KEY" \
            "https://bunnycdn.com/api/pullzone/$ZONE_ID/purgeCache"

          # latest.json is what the next run compares against, so a stale edge
          # copy here would republish this version forever.
          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -sS -L "$CDN_BASE/latest.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            if [ "$LIVE" = "$VERSION" ]; then
              echo "edge serves version $LIVE"
              exit 0
            fi
            echo "attempt $attempt: edge serves '$LIVE', want '$VERSION'"
            sleep 10
          done
          echo "::error::edge never served the new latest.json"
          exit 1

      - name: Render the cask
        env:
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ steps.pack.outputs.sha256 }}
        run: |
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA/" \
            packaging/chuzz.rb.in > chuzz.rb
          cat chuzz.rb

      # Committed to the tap only when a token is present. Without one the
      # release still completes and the rendered cask is attached below, so the
      # tap can be updated by hand. Failing the release for a missing token
      # would leave a published tarball nobody can install, which is worse.
      # The `secrets` context is not available to `if`, so the token is lifted
      # into `env` first and the condition reads that. Writing
      # `if: secrets.TAP_GITHUB_TOKEN != ''` looks right, is accepted, and is
      # always false.
      - name: Update the Homebrew tap
        if: env.TAP_GITHUB_TOKEN != ''
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:$TAP_GITHUB_TOKEN@github.com/pathscale/homebrew-tap.git" tap
          cp chuzz.rb tap/Casks/chuzz.rb
          cd tap
          if git diff --quiet; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git config user.name "pathscale-ci"
          git config user.email "ci@pathscale.com"
          git add Casks/chuzz.rb
          git commit -m "Chuzz $VERSION"
          git push

      - name: Attach the cask and the manifest
        uses: actions/upload-artifact@v4
        with:
          name: chuzz-${{ needs.check.outputs.version }}
          path: |
            chuzz.rb
            latest.json

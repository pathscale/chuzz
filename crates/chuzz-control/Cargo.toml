[package]
name = "chuzz-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The socket server. Types are always available; the listener is opt-in so a
# build that only speaks the protocol does not pull in a transport.
default = ["server"]
server = ["dep:endpoint-libs", "dep:nagoya", "dep:futures"]
reactor-witness = ["server"]

[[bin]]
name = "control-reactor-witness"
path = "src/bin/control_reactor_witness.rs"
required-features = ["reactor-witness"]

[dependencies]
nagoya = { workspace = true, optional = true }
futures = { version = "^0.3", optional = true }
blitz-control-protocol = { workspace = true, default-features = false, features = ["client"] }
endpoint-libs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
base64 = "^0.22"
png = "^0.18.1"


[workspace]
members = ["apps/chuzz", "crates/chuzz-control"]
resolver = "3"

[workspace.package]
version = "0.1.34"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["PathScale Pte Ltd"]
repository = "https://github.com/pathscale/chuzz"
homepage = "https://github.com/pathscale/chuzz"

[workspace.dependencies]
# The engine, by version.
#
# These were `path = "../ps-blitz/..."`, then revisions. The path form made the
# sibling checkout on each machine the real dependency and left the revision CI
# used declared separately in a `BLITZ_REF` env var, two sources of truth that
# nothing reconciled: the pin sat 44 commits behind while local builds moved on.
# A revision fixed that and introduced its own tax, because a git dependency is
# not a version: every engine release meant editing eight lines here and a
# matching set in `tauri-runtime-blitz`, and the day those disagreed cargo put
# two engines in the graph and reported it as
#
#   expected `blitz_script::document::ScriptDocument`, found `ScriptDocument`
#
# with both types pointing at the same file.
#
# A caret is what was meant all along. `cargo update` moves it, `Cargo.lock`
# records what was resolved, and anything else asking for the same range gets
# the same crate rather than a second copy. To build against a working checkout,
# see `scripts/local-engine.sh`; it is opt-in so the default exercises what a
# release actually resolves.
blitz-dom = { package = "ps-blitz-dom", version = "^0.4" }
blitz-html = { package = "ps-blitz-html", version = "^0.4" }
blitz-net = { package = "ps-blitz-net", version = "^0.4" }
blitz-script = { package = "ps-blitz-script", version = "^0.4" }
blitz-traits = { package = "ps-blitz-traits", version = "^0.4" }
# The wasmi host binding over blitz-dom-api, so a WebAssembly guest can build a
# document with no JavaScript and no URL in the path.
blitz-wasm = { package = "ps-blitz-wasm", version = "^0.4" }
dioxus-native = { package = "ps-dioxus-native", version = "^0.7.3", default-features = false }
# The MCP framing the control server speaks, same source and feature as
# tauri-runtime-blitz uses for its agent-control surface.
endpoint-libs = { version = "^3", default-features = false, features = ["agent-control"] }
brotli = { version = "8", default-features = false, features = ["std"] }
image = { version = "^0.25.6", default-features = false }
# Headless capture: renders a page to a buffer with the CPU rasteriser, so the
# result can be inspected without a window.
#
# Must be the same anyrender blitz-paint links against, or PaintScene is two
# unrelated traits and the painter cannot be passed to paint_scene. That used to
# mean keeping a revision here equal by hand to the one in
# `ps-blitz/Cargo.toml`, and it rotted exactly as you would expect: ps-blitz
# moved to acb9714 while this stayed on 0e4122b, breaking every `--capture`
# build with
#
#   error[E0277]: the trait bound `VelloCpuScenePainter: PaintScene` is not satisfied
#   note: there are multiple different versions of crate `ps_anyrender_vello_cpu`
#
# reading as a broken painter when it was really two of them.
#
# Both sides take it by version now, so cargo unifies them instead of two people
# remembering to. A caret is also what ps-blitz declares, so the ranges agree by
# construction rather than by coincidence.
anyrender = { package = "ps-anyrender", version = "^0.13.0" }
# `filters` is off by default in the backend, and with it off `push_layer`
# discards both the element's `filter:` and its `backdrop-filter:`.
#
# It was compiled out here for a while because leaving it on aborted the
# process on any page with a backdrop: `paint_filtered_backdrop` snapshots with
# `render_to_pixmap`, which asserts no layer is open, and blitz-paint reaches
# `push_layer` several frames deep. That abort was caught first by declining
# every backdrop inside a layer, which is every backdrop on a real page; the
# revision below closes the stack, snapshots, and reopens it, so glass renders
# in the CPU paths as well as on the GPU.
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", version = "^0.17.0", features = ["filters"] }
blitz-paint = { package = "ps-blitz-paint", version = "^0.4" }
png = "=0.18.1"
# Naming `wasmi::Linker` is unavoidable: `blitz_wasm::add_to_linker` takes one,
# and blitz-wasm does not re-export the runtime. This must stay on the same
# semver line blitz-wasm pins (1.x, not 2.0.0-beta), or cargo links two wasmi
# crates and the `Linker<Host>` built here is a different type from the one that
# function accepts.
wasmi = "1.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
url = "2.5"
tauri = { version = "^2.11.5", default-features = false }
# `diagnostics`, always, rather than behind a cargo feature.
#
# It is two runtime planes, and neither costs anything until it is switched on
# in Settings. The first is `agent-control`, the default: an Inspect/Act socket
# that reads the semantic tree and drives the pointer and keyboard, which is enough for
# an agent to browse. The second is `debug-control`, which this adds: DOM,
# layout and computed-style snapshots, renderer metrics, and the CPU screenshot
# of the live window. That one binds nothing unless `TAURI_BLITZ_DRIVER` names
# an address, so a build carrying it and a build without it do the same work on
# a run where nobody asks.
#
# Compiled out, the second plane is not a switch that is off. It is a switch
# that is not there, and the difference only shows when something needs
# explaining. A window that would not paint could not be photographed by the
# one thing that could photograph it, because the capability had been optimised
# out of the binary that needed it.
tauri-runtime-blitz = { version = "^0.3.2", features = ["diagnostics"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep symbols and line tables in the release binary.
#
# A crash report is only as useful as what can be resolved from it: az-gui ships
# stripped, and its stack came back as 73 identical `__mh_execute_header`
# entries, which says nothing at all. `line-tables-only` is the cheap half of
# debug info — file and line for every frame, no variable info — so `atos`
# resolves a report without the size and link time of full `debug = 2`.
debug = "line-tables-only"
strip = "none"

# No patch table. There was one: `[patch]` only applies from the top-level
# workspace, so ps-blitz's own was ignored when chuzz is the root, and its
# blitz-dom needs a `usvg` carrying `Tree::intrinsic_dimensions` and
# `pub use svgtypes` that no published linebender usvg has. That had to be
# copied here and kept in step by hand.
#
# The fork is published as `ps-usvg` now and ps-blitz depends on it by version,
# so the requirement travels with the dependency instead of being restated by
# every consumer.

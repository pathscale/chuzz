[workspace]
members = ["apps/chuzz", "crates/chuzz-control"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Path dependencies into the local Blitz checkout, the way AgencyZero's
# blitz-preview consumes it. The crates there are namespaced `ps-blitz-*`.
# A git rev cannot be used instead: the fix for compressed responses lives in
# that tree, and mixing the two would put two copies of the DOM types in play.
blitz-dom = { package = "ps-blitz-dom", path = "../blitz-rust/packages/blitz-dom" }
blitz-html = { package = "ps-blitz-html", path = "../blitz-rust/packages/blitz-html" }
blitz-net = { path = "../blitz-rust/packages/blitz-net" }
blitz-script = { package = "ps-blitz-script", path = "../blitz-rust/packages/blitz-script" }
blitz-traits = { package = "ps-blitz-traits", path = "../blitz-rust/packages/blitz-traits" }
dioxus-native = { path = "../blitz-rust/packages/dioxus-native", default-features = false }
brotli = { version = "8", default-features = false, features = ["std"] }
image = { version = "=0.25.6", default-features = false }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1

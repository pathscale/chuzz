[workspace]
members = ["apps/chuzz", "crates/chuzz-control"]
resolver = "3"

[workspace.package]
version = "0.1.29"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["PathScale Pte Ltd"]
repository = "https://github.com/pathscale/chuzz"
homepage = "https://github.com/pathscale/chuzz"

[workspace.dependencies]
# The engine, by revision rather than by path.
#
# These were `path = "../ps-blitz/..."`, which made the sibling checkout on each
# machine the real dependency and left the revision CI used declared separately,
# in a `BLITZ_REF` env var in release.yml. Two sources of truth that nothing
# reconciled: the pin sat 44 commits behind while local builds moved on, and the
# release job broke the moment a new engine package was added, because a path
# dependency resolves against whatever is on disk and no local build can notice.
#
# A rev here is the single declaration. `Cargo.lock` records it, CI needs no
# clone step, and an ordinary `cargo build` fetches exactly what a release does.
# To build against a working checkout, see `scripts/local-engine.sh`; it is
# opt-in precisely so that the default exercises these pins.
#
# `tauri-runtime-blitz` pins this same revision, which is what keeps one engine
# in the graph. Move the two together, or `PaintScene` becomes two unrelated
# traits and the errors read as a broken engine rather than as two of them.
blitz-dom = { package = "ps-blitz-dom", git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
blitz-html = { git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
blitz-net = { git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
blitz-script = { package = "ps-blitz-script", git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
blitz-traits = { package = "ps-blitz-traits", git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
# The wasmi host binding over blitz-dom-api, so a WebAssembly guest can build a
# document with no JavaScript and no URL in the path.
blitz-wasm = { git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
dioxus-native = { git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18", default-features = false }
# The MCP framing the control server speaks, same source and feature as
# tauri-runtime-blitz uses for its agent-control surface.
endpoint-libs = { git = "https://github.com/pathscale/endpoint-libs.git", rev = "7eff4d850f1c84c1104c0729c68f50711940b7fb", default-features = false, features = ["agent-control"] }
brotli = { version = "8", default-features = false, features = ["std"] }
image = { version = "=0.25.6", default-features = false }
# Headless capture: renders a page to a buffer with the CPU rasteriser, so the
# result can be inspected without a window.
# Must be the same anyrender blitz-paint links against, or PaintScene is two
# unrelated traits and the painter cannot be passed to paint_scene. blitz-paint
# takes it from whatever `ps-blitz/Cargo.toml` pins at the revision above, so
# this rev has to be kept equal to that one by hand. It rotted once: ps-blitz
# moved to acb9714 and this stayed on 0e4122b, which broke every `--capture`
# build with
#
#   error[E0277]: the trait bound `VelloCpuScenePainter: PaintScene` is not satisfied
#   note: there are multiple different versions of crate `ps_anyrender_vello_cpu`
#
# reading as a broken painter when it was really two of them.
anyrender = { package = "ps-anyrender", git = "https://github.com/pathscale/ps-anyrender.git", rev = "cd8b39c6fb10eec914334b526721cc7e7387a793" }
# `filters` is off by default in the backend, and with it off `push_layer`
# discards both the element's `filter:` and its `backdrop-filter:`.
#
# It was compiled out here for a while because leaving it on aborted the
# process on any page with a backdrop: `paint_filtered_backdrop` snapshots with
# `render_to_pixmap`, which asserts no layer is open, and blitz-paint reaches
# `push_layer` several frames deep. Fixed upstream in anyrender cd8b39c, so it
# is back on and plain `filter:` works again with it.
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", git = "https://github.com/pathscale/ps-anyrender.git", rev = "cd8b39c6fb10eec914334b526721cc7e7387a793", features = ["filters"] }
blitz-paint = { git = "https://github.com/pathscale/ps-blitz.git", rev = "7e1f0bb096c19a24599b017c6bef0b18616c2d18" }
png = "=0.18.1"
# Naming `wasmi::Linker` is unavoidable: `blitz_wasm::add_to_linker` takes one,
# and blitz-wasm does not re-export the runtime. This must stay on the same
# semver line blitz-wasm pins (1.x, not 2.0.0-beta), or cargo links two wasmi
# crates and the `Linker<Host>` built here is a different type from the one that
# function accepts.
wasmi = "1.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
url = "2.5"
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime-blitz = { git = "https://github.com/pathscale/tauri-runtime-blitz.git", rev = "2087cfa542e303ad37c21e4ba4337a52497a8c2a" }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep symbols and line tables in the release binary.
#
# A crash report is only as useful as what can be resolved from it: az-gui ships
# stripped, and its stack came back as 73 identical `__mh_execute_header`
# entries, which says nothing at all. `line-tables-only` is the cheap half of
# debug info — file and line for every frame, no variable info — so `atos`
# resolves a report without the size and link time of full `debug = 2`.
debug = "line-tables-only"
strip = "none"

# `[patch]` only applies from the top-level workspace, so ps-blitz's own patch
# section is ignored when chuzz is the root. Its blitz-dom calls
# `usvg::Tree::intrinsic_dimensions`, which exists only on this branch, so
# without this the engine does not compile here even though it compiles there.
# Keep this in step with `ps-blitz/Cargo.toml`'s `[patch.crates-io]`.
[patch.crates-io]
usvg = { git = "https://github.com/DioxusLabs/resvg", branch = "devin/1785858271-intrinsic-dimensions" }

[workspace]
members = ["apps/chuzz", "crates/chuzz-control"]
resolver = "3"

[workspace.package]
version = "0.1.28"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["PathScale Pte Ltd"]
repository = "https://github.com/pathscale/chuzz"
homepage = "https://github.com/pathscale/chuzz"

[workspace.dependencies]
# Path dependencies into the local Blitz checkout, the way AgencyZero's
# blitz-preview consumes it. The crates there are namespaced `ps-blitz-*`.
# A git rev cannot be used instead: the fix for compressed responses lives in
# that tree, and mixing the two would put two copies of the DOM types in play.
blitz-dom = { package = "ps-blitz-dom", path = "../ps-blitz/packages/blitz-dom" }
blitz-html = { path = "../ps-blitz/packages/blitz-html" }
blitz-net = { path = "../ps-blitz/packages/blitz-net" }
blitz-script = { package = "ps-blitz-script", path = "../ps-blitz/packages/blitz-script" }
blitz-traits = { package = "ps-blitz-traits", path = "../ps-blitz/packages/blitz-traits" }
dioxus-native = { path = "../ps-blitz/packages/dioxus-native", default-features = false }
# The MCP framing the control server speaks, same source and feature as
# tauri-runtime-blitz uses for its agent-control surface.
endpoint-libs = { path = "../endpoint-libs", default-features = false, features = ["agent-control"] }
brotli = { version = "8", default-features = false, features = ["std"] }
image = { version = "=0.25.6", default-features = false }
# Headless capture: renders a page to a buffer with the CPU rasteriser, so the
# result can be inspected without a window.
# Must be the same anyrender blitz-paint links against, or PaintScene is two
# unrelated traits and the painter cannot be passed to paint_scene.
anyrender = { package = "ps-anyrender", git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }
# `filters` is off by default in the backend, and with it off `push_layer`
# discards both the element's `filter:` and its `backdrop-filter:`.
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea", features = ["filters"] }
blitz-paint = { path = "../ps-blitz/packages/blitz-paint" }
png = "=0.18.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
url = "2.5"
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime-blitz = { path = "../tauri-runtime-blitz/crates/tauri-runtime-blitz" }

[profile.release]
lto = "thin"
codegen-units = 1
# Keep symbols and line tables in the release binary.
#
# A crash report is only as useful as what can be resolved from it: az-gui ships
# stripped, and its stack came back as 73 identical `__mh_execute_header`
# entries, which says nothing at all. `line-tables-only` is the cheap half of
# debug info — file and line for every frame, no variable info — so `atos`
# resolves a report without the size and link time of full `debug = 2`.
debug = "line-tables-only"
strip = "none"

# `[patch]` only applies from the top-level workspace, so ps-blitz's own patch
# section is ignored when chuzz is the root. Its blitz-dom calls
# `usvg::Tree::intrinsic_dimensions`, which exists only on this branch, so
# without this the engine does not compile here even though it compiles there.
# Keep this in step with `ps-blitz/Cargo.toml`'s `[patch.crates-io]`.
[patch.crates-io]
usvg = { git = "https://github.com/DioxusLabs/resvg", branch = "devin/1785858271-intrinsic-dimensions" }

# tauri-runtime-blitz pins ps-blitz by git rev, while this workspace consumes it
# by path. Without this patch the two resolve to *different* engines in one
# build, and the symptom is not a version warning but a missing method:
#
#   error: cannot find function `set_deep_profiling_enabled` in crate `blitz_shell`
#   error: no method named `add_poll_hook` found for `&mut ScriptDocument`
#
# Both exist on the local checkout and neither exists at the pinned rev, so the
# error reads as "the engine is broken" when it is really "there are two".
# Redirect the git source at the same paths this workspace already uses, so
# every crate in the graph links one engine.
[patch."https://github.com/pathscale/ps-blitz.git"]
ps-blitz-dom = { path = "../ps-blitz/packages/blitz-dom" }
ps-blitz-script = { path = "../ps-blitz/packages/blitz-script" }
ps-blitz-shell = { path = "../ps-blitz/packages/blitz-shell" }
ps-blitz-traits = { path = "../ps-blitz/packages/blitz-traits" }
